<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Bricks-List</title>
    <meta name="description" content="Collection de sets LEGO : catalogue, wishlist et statistiques." />
    <!-- Valeur de départ, remplacée par le script ci-dessous dès que le thème est connu. -->
    <meta name="theme-color" content="#000000" />
    <!-- Le thème est appliqué avant le premier rendu : posé par React dans un effet,
         l'app s'afficherait un instant dans le mauvais thème (flash). Ce script
         duplique volontairement resoudreTheme() de src/lib/apparence.js : il doit
         s'exécuter avant tout module, donc avant que le bundle existe.
         Trois valeurs possibles dans bl_theme : « auto » (ou rien), « light »,
         « dark ». Automatique suit le réglage du téléphone. -->
    <script>
      try {
        var t = localStorage.getItem("bl_theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = t === "light" ? "#f3f4f7" : "#000000";
      } catch (e) { /* stockage indisponible : on reste sur le thème sombre */ }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
